[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coverletterai"
version = "0.1.0"
description = "AI-driven cover-letter tailoring service: reads a job description + a tailored resume, then produces a 1-page LaTeX-rendered cover letter that lines up with the resume's bullets."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jonathan Duketis" }]
requires-python = ">=3.12"
keywords = ["cover-letter", "ai", "agent", "latex", "tectonic", "fastapi", "claude"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Typing :: Typed",
]
dependencies = [
  # Shared building blocks: LLM client, JD ingest, run orchestration,
  # verifier scaffolding, user-context loader. Fetched from git on CI;
  # local quality gate installs an editable sibling first.
  "ai-tailor-core @ git+https://github.com/duketis/ai-tailor-core.git@main",
  "httpx[http2]>=0.27,<1.0",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.1,<3.0",
  "structlog>=24.1",
  "typer>=0.12,<1.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0,<3.0",
  "sse-starlette>=2.0",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "pypdf>=4.0",
  "pypdfium2>=4.30",
  "Pillow>=10.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-mock>=3.12",
  "respx>=0.20",
  "mypy>=1.8",
  "ruff>=0.3",
  "types-pyyaml",
  "pre-commit>=3.6",
]

[project.scripts]
coverletterai = "coverletterai.cli:app"

[project.urls]
Repository = "https://github.com/duketis/coverletterai"
Issues = "https://github.com/duketis/coverletterai/issues"

[tool.setuptools.packages.find]
include = ["coverletterai*"]
exclude = ["tests*", "_private*", "UserContext*"]

[tool.setuptools.package-data]
coverletterai = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff - lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_private", "UserContext", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4", "S", "BLE", "RET",
  "SIM", "PTH", "PL", "TRY", "ASYNC", "RUF",
]
ignore = [
  "PLR0913",
  "TRY003",
  "PLR2004",
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ANN", "PLR0915", "S105", "S106", "S107", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "typer.Option",
  "typer.Argument",
  "fastapi.Depends",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Body",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Cookie",
  "fastapi.Security",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy - strict static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
ignore_missing_imports = false
show_error_codes = true
pretty = true
files = ["coverletterai", "tests"]
exclude = ["_private/", "UserContext/", "build/", "dist/"]
# Setuptools' PEP 660 editable install uses a runtime finder hook that mypy
# can't trace, so ``from tailor_core...`` fails to resolve. Point mypy at
# the sibling source directly. Runtime resolution still goes through pip.
mypy_path = "../ai-tailor-core"

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest - testing
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "integration: integration tests (may touch network or filesystem)",
]
filterwarnings = [
  "error",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["coverletterai"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]
